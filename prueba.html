<div id="splash" role="dialog" aria-label="SplitCoach">
<style>
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#0E5F7A;transition:opacity .6s ease}
#splash::before{content:"";position:absolute;inset:-20px;background:url(splash-bg.jpg) center/cover;filter:blur(3px)}
#splash.out{opacity:0;pointer-events:none}
#splash img{--sz:min(112vw,100vh,1024px);position:absolute;left:50%;top:50%;margin:calc(var(--sz)/-2) 0 0 calc(var(--sz)/-2);max-width:none;width:var(--sz);height:var(--sz);animation:sp-in 1.1s ease both;-webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%)}
#splash button{position:absolute;left:50%;bottom:max(7vh,calc(env(safe-area-inset-bottom,0px) + 32px));transform:translateX(-50%);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:99px;padding:11px 34px;font:600 12px/1 "Figtree",system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;cursor:pointer;opacity:0;animation:sp-btn .8s ease 1s forwards;transition:background .2s}
#splash button:hover,#splash button:focus-visible{background:rgba(255,255,255,.26);outline:none}
@keyframes sp-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes sp-btn{to{opacity:.95}}
@media (prefers-reduced-motion:reduce){#splash img,#splash button{animation:none;opacity:1}}
</style>
<img src="splash.jpg" alt="SplitCoach">
<button type="button" id="sp-go">Entrar</button>
<script>(function(){var el=document.getElementById("splash"),seen=false;try{seen=sessionStorage.getItem("sc-splash")==="1"}catch(e){}
if(seen){el.remove();return}
function go(){try{sessionStorage.setItem("sc-splash","1")}catch(e){}el.classList.add("out");setTimeout(function(){el.remove()},620)}
document.getElementById("sp-go").onclick=go;document.addEventListener("keydown",function k(e){if(e.key==="Enter"&&document.getElementById("splash")){document.removeEventListener("keydown",k);go()}});})();</script>

<style>
/* Layout: app de entrenador en una columna; cabecera fija con logo y pestañas. Tema: pizarra oscura + turquesa (por defecto) o versión clara con el botón ☀ */
:root{
  --bg:#1E252C; --surface:#2A333C; --ink:#F3F6F8; --muted:#9AA8B4; --line:#3A4550; --soft:#343E48;
  --accent:#4DB6BF; --accent-ink:#0E2A2E; --rope:#FF7A6B; --rope2:#2A333C;
  --gold:#E2B743; --silver:#A9B8BE; --bronze:#D58A52; --good:#5CCB97; --bad:#FF7A6B;
  --z1:#6FA9BA; --z2:#3BAACB; --z3:#5CCB97; --z4:#E8B04A; --z5:#FF7A6B; --zrp:#B58AE6;
  --glass:rgba(30,37,44,.86); --brand:#FFFFFF; --eyebrow:#4DB6BF;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.6);
  --bgfx:radial-gradient(70% 45% at 8% 0%,rgba(77,182,191,.13),transparent 65%),radial-gradient(60% 40% at 100% 100%,rgba(77,182,191,.07),transparent 70%),linear-gradient(180deg,#252D36 0%,#1B2127 100%);
  --f-brand:"Plus Jakarta Sans","Figtree",system-ui,sans-serif;
  --f-display:"Plus Jakarta Sans","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#1E252C; --muted:#5B6875; --line:#D9E1E6; --soft:#EAF0F3;
  --accent:#1F8C96; --accent-ink:#FFFFFF; --rope:#D9443A; --rope2:#FFFFFF;
  --gold:#B88A12; --silver:#7C8B92; --bronze:#A8622E; --good:#1F8A5B; --bad:#C0392B;
  --z1:#7FB7C9; --z2:#2E93B0; --z3:#1F8A5B; --z4:#D99A1E; --z5:#D9443A; --zrp:#7A3FB0;
  --glass:rgba(255,255,255,.88); --brand:#1E252C; --eyebrow:#1F8C96;
  --shadow:0 1px 2px rgba(30,37,44,.05),0 10px 28px -14px rgba(30,37,44,.18);
  --bgfx:radial-gradient(70% 45% at 8% 0%,rgba(31,140,150,.10),transparent 65%),linear-gradient(180deg,#F6F9FA 0%,#EDF2F4 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;
  background:var(--bgfx) fixed,var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.rope{height:5px;background:repeating-linear-gradient(90deg,var(--rope) 0 14px,var(--rope2) 14px 28px)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 6px}
.brand img{flex:none;width:50px;height:50px;border-radius:12px;object-fit:contain;background:#fff;padding:2px;box-shadow:0 0 0 1px var(--line)}
.word{font-family:var(--f-brand);font-weight:800;font-size:25px;line-height:1;letter-spacing:-.01em;color:var(--brand)}
.word small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}

main{padding-block:18px 56px;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.1;text-wrap:balance}

.muted{color:var(--muted)} .small{font-size:13px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}

.list{display:grid}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;text-decoration:none}

.zb{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:13px;padding:1px 7px;border-radius:5px;color:#fff}

.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}.mx{background:var(--soft);color:var(--muted)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.tablewrap{overflow-x:auto;margin-inline:-4px}

.msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--soft)}

<script>
(function(){
"use strict";
/* ================= constantes ================= */
const ESTILOS=["Libre","Espalda","Pecho","Mariposa","Combinado"];
const PRUEBAS=["50 Libre","100 Libre","200 Libre","400 Libre","800 Libre","1500 Libre","50 Espalda","100 Espalda","200 Espalda","50 Pecho","100 Pecho","200 Pecho","50 Mariposa","100 Mariposa","200 Mariposa","100 Combinado","200 Combinado","400 Combinado"];
const PUNTOS=[9,7,6,5,4,3,2,1];
const Z_DEF=[{z:"Z1",n:"Recuperación",min:70,max:75},{z:"Z2",n:"Aeróbico",min:75,max:80},{z:"Z3",n:"Umbral",min:80,max:90},{z:"Z4",n:"VO2 máx",min:90,max:95},{z:"Z5",n:"Velocidad",min:95,max:100}];
const ZCOL={Z1:"var(--z1)",Z2:"var(--z2)",Z3:"var(--z3)",Z4:"var(--z4)",Z5:"var(--z5)",RP:"var(--zrp)"};
const RIEGEL=1.06;

/* ================= estado ================= */
const S={nad:[],res:[],ses:[],vid:[],par:[],cfg:{miClub:"",zonas:Z_DEF},
  db:null,assets:null,sample:null,dbState:"cargando",got:{},
  view:"plantel",param:"",pending:false,
  q:"",newNad:false,fd:null,
  mt:{estilo:"Libre",pisc:"25",rama:"",scope:"plantel",sort:""},
  rTab:"torneos",year:null,rv:{prueba:"",sexo:"",cat:""},
  ed:null, rd:null, rsel:"",
  calc:{nad:"",estilo:"Espalda",dist:100,pb:"1:24.00",sets:"4x50\n6x25\n2x100",pisc:"25"},
  dps:{largo:25,cuenta:"ciclos",sub:5,txt:"18.6;9\n19.1;9\n19.8;10\n20.4;10"},
  split:{dist:200,t:"2:30.00",tramo:50},
  int:{estilo:"Libre",pisc:"25",nad:"",man:{}},
  pace:{d1:200,t1:"2:30.00",d2:400,p2:"1:30.00",obj:"1:50",real:"1:31"},
  vp:null,buz:{},chat:null,mode:"?",me:null,user:null,myThread:null,gotThread:false,ctipo:"mensaje",cvid:"",ctxt:""};

/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const uniq=a=>[...new Set(a.filter(x=>x!==""&&x!=null))];
function parseT(t){
  t=String(t==null?"":t).trim().replace(",",".");
  if(!t||/^(nt|ns|dq|dsq|dnf)$/i.test(t))return null;
  let m=t.match(/^(\d+)[:.](\d{1,2})[.](\d{1,2})$/);
  if(m)return +m[1]*60+ +m[2]+ +(m[3].padEnd(2,"0"))/100;
  m=t.match(/^(\d+):(\d{1,2})$/); if(m)return +m[1]*60+ +m[2];
  m=t.match(/^(\d{1,2})\.(\d{2})$/); if(m&&+m[1]<15)return +m[1]*60+ +m[2]; // "1.24" = 1:24
  m=t.match(/^(\d+(?:\.\d{1,2})?)$/); if(m)return +m[1];
  return null;
}
function fmtT(s,dec){
  if(s==null||!isFinite(s))return "—";
  dec=dec==null?2:dec;
  const f=Math.pow(10,dec);s=Math.round(s*f)/f;
  const m=Math.floor(s/60),r=s-m*60;
  const rs=r.toFixed(dec);
  return m?m+":"+(r<10?"0":"")+rs:rs;
}
const fmtD=d=>{if(!d)return "";const p=String(d).split("-");return p.length===3?p[2]+"-"+p[1]+"-"+p[0]:d};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const estiloOf=p=>String(p||"").split(" ").slice(1).join(" ");
const distOf=p=>parseInt(p,10)||0;
function ordPrueba(p){const i=ESTILOS.indexOf(estiloOf(p));return (i<0?9:i)*10000+distOf(p)}
function catDe(e){e=parseInt(e,10);if(isNaN(e))return "";if(e<25)return "Pre Master";const a=Math.floor((e-25)/5)*5+25;return a+"-"+(a+4)}
function edadMaster(nac){const y=parseInt(String(nac||"").slice(0,4),10);return isNaN(y)?null:new Date().getFullYear()-y}
const ordCat=c=>c==="Pre Master"?0:(parseInt(c,10)||999);
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const sx=x=>x==="F"?"Damas":x==="M"?"Varones":"—";
const yearOf=r=>String(r.fecha||"").slice(0,4);
const isMine=r=>!!S.cfg.miClub&&norm(r.club).includes(norm(S.cfg.miClub));
const zonas=()=>(Array.isArray(S.cfg.zonas)&&S.cfg.zonas.length?S.cfg.zonas:Z_DEF);
function zb(z){return `<span class="zb" style="background:${ZCOL[z]||ZCOL[zoneKey(z)]||"var(--muted)"}">${esc(z)}</span>`}
function weekStart(d){const x=new Date(d+"T12:00:00");if(isNaN(x))return "";const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10)}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);if(btn){const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1400)}}catch(e){if(btn)btn.textContent="No se pudo copiar"}}

/* ================= datos derivados ================= */
// nombres con los que aparece un nadador (nombre + alias separados por coma)
const keysOf=n=>new Set([n.nombre,...String(n.alias||"").split(",")].map(norm).filter(Boolean));
const nadByName=name=>{const k=norm(name);return S.nad.find(n=>keysOf(n).has(k))};
const resOf=nombre=>{const n=nadByName(nombre);const ks=n?keysOf(n):new Set([norm(nombre)]);return S.res.filter(r=>ks.has(norm(r.nadador)))};
const nadById=id=>S.nad.find(n=>n.id===id);
function pbsOf(nombre,pisc){ // prueba -> mejor fila (opcional filtro piscina)
  const out={};
  resOf(nombre).forEach(r=>{if(r.seg==null)return;if(pisc&&String(r.piscina)!==String(pisc))return;const k=r.prueba;if(!out[k]||r.seg<out[k].seg)out[k]=r});
  return out;
}
function refPB(nombre,estilo,dist,pisc){
  const rows=resOf(nombre).filter(r=>r.seg!=null&&estiloOf(r.prueba)===estilo);
  if(!rows.length)return null;
  let best=null;
  rows.forEach(r=>{const d=distOf(r.prueba);if(!d)return;
    const score=Math.abs(Math.log(d/dist))+(String(r.piscina)===String(pisc)?0:0.3);
    if(!best||score<best.score-1e-9||(Math.abs(score-best.score)<1e-9&&r.seg<best.r.seg))best={score,r,d}});
  if(!best)return null;
  return {t:best.r.seg*Math.pow(dist/best.d,RIEGEL),d:best.d,r:best.r,exact:best.d===dist};
}
const PCTS=["70%","75%","80%","85%","90%","95%"];
function zoneKey(z){const m=String(z||"").match(/^(\d+)%$/);if(!m)return z;const p=+m[1];const Z=zonas().find(x=>p>=x.min&&p<x.max)||zonas()[zonas().length-1];return Z.z}
function zoneRange(t,z){
  if(z==="RP")return [t,t];
  const pm=String(z||"").match(/^(\d+)%$/);if(pm)return [t/(+pm[1]/100),t/(+pm[1]/100)];
  const Z=zonas().find(x=>x.z===z); if(!Z)return null;
  return [t/(Z.max/100),t/(Z.min/100)];
}
const volOf=s=>(s.series||[]).reduce((a,x)=>a+(+x.reps||0)*(+x.dist||0),0);

/* ================= navegación ================= */
const VIEWS=["plantel","tiempos","resultados","entrenos","resumen","evolucion","calculadora","videos","mensajes"];
function route(){
  const h=decodeURIComponent((location.hash||"#plantel").slice(1));
  let v=h,p="";
  if(h.startsWith("ficha-")){v="ficha";p=h.slice(6)}
  else if(h.startsWith("video-")){v="video";p=h.slice(6)}
  else if(h.startsWith("chat-")){v="chat";p=h.slice(5)}
  else if(h.startsWith("inf-")){v="informe";p=h.slice(4)}
  else if(!VIEWS.includes(h))v="plantel";
  if(S.mode==="nadador"&&v!=="informe"&&v!=="video"){v=h==="mensajes"?"yo":h==="torneos"?"mistorneos":h==="misvideos"?"misvideos":h==="misentrenos"?"misinformes":"mificha";p=""}
  S.view=v;S.param=p;
  if(S.mode==="coach"&&S.db&&(v==="resultados"||(v==="tiempos"&&S.mt.scope!=="plantel")))loadFullTor();
  const tab=S.mode==="nadador"&&v==="video"?"misvideos":S.mode==="nadador"&&v==="informe"?"misentrenos":v==="misinformes"?"misentrenos":v==="mistorneos"?"torneos":v==="informe"?(S.mode==="nadador"?"mificha":"evolucion"):v==="ficha"?"plantel":v==="video"?"videos":v==="chat"||v==="yo"?"mensajes":v;
  $$("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===tab?"page":"false"));
  if(v!=="video")stopVideo();
  S.pending=false;
  render(true);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
function typing(){const a=document.activeElement;return a&&$("#view").contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!["checkbox","range","button","file"].includes(a.type)))}
function render(force){
  if(!force&&(typing()||(S.view==="video"&&S.vp))){S.pending=true;if(S.view==="video")refreshMarks();return}
  S.pending=false;
  const fn=S.mode==="?"?{html:()=>emptyBox("Cargando…","")}:(R[S.view]||R.plantel);
  $("#view").innerHTML=banner()+fn.html();
  if(S.mode==="coach"){$("#nb").textContent=String(S.nad.filter(n=>unread(S.buz[tk(n)],"coach")).length||"");scheduleSync()}
  else if(S.mode==="nadador"&&$("#nb"))$("#nb").textContent=unread(S.myThread,"nadador")?"1":"";
  fn.bind&&fn.bind();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!typing()&&!(S.view==="video"&&S.vp))render()},30));
function banner(){
  if(S.fullTor==="loading"&&(S.view==="resultados"||(S.view==="tiempos"&&S.mt.scope!=="plantel")))return `<div class="msg">Cargando todos los torneos…</div>`;
  if(S.dbState==="sin-db")return `<div class="msg err">La base de datos no está disponible en esta vista. Revisa tu conexión y recarga la página.</div>`;
  return "";
}
function emptyBox(title,text){
  return `<section class="card empty"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true"><path d="M3 30c4 0 4-3 8-3s4 3 8 3 4-3 8-3 4 3 8 3 4-3 6-3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M3 37c4 0 4-3 8-3s4 3 8 3 4-3 8-3 4 3 8 3 4-3 6-3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".45"/><circle cx="27" cy="13" r="4" fill="currentColor"/><path d="M10 22l9-6 6 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>${title}</h3><div class="muted small" style="max-width:46ch">${text}</div></section>`;
}
const loading=()=>!S.got.res&&S.dbState==="cargando";
async function dbWrite(fn,msgEl){
  if(!S.db){if(msgEl)msgEl.innerHTML=`<span class="down">La base de datos no está disponible.</span>`;return false}
  try{await fn(S.db);return true}catch(e){if(msgEl)msgEl.innerHTML=`<span class="down">No se pudo guardar: ${esc(e&&e.message||e&&e.code||e)}</span>`;return false}
}

/* ================= gráficos ================= */
function spark(pts){
  {const byD={};pts.forEach(p=>{const k=p.fecha||"";if(!byD[k]||p.seg<byD[k].seg)byD[k]=p});pts=Object.values(byD).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))}
  if(pts.length<2)return "";
  const W=300,H=44,P=6,xs=pts.map(p=>Date.parse(p.fecha)||0),ys=pts.map(p=>p.seg);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=x=>P+(x1===x0?.5:(x-x0)/(x1-x0))*(W-2*P),Y=y=>P+(y1===y0?.5:(y-y0)/(y1-y0))*(H-2*P);
  const li=pts.length-1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución de tiempos (arriba es más rápido)">
    <line x1="0" x2="${W}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="var(--line)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>
    <path d="${pts.map((p,i)=>(i?"L":"M")+X(xs[i]).toFixed(1)+" "+Y(ys[i]).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="${i===li?3.5:2}" fill="${i===li?"var(--rope)":"var(--accent)"}"/>`).join("")}</svg>`;
}
function barChart(items,{h=150,fmt=v=>v,color="var(--accent)"}={}){
  // items: [{label, value, stack?:[{v,c}]}]
  const W=Math.max(300,items.length*44),P={l:8,r:8,t:18,b:22};
  const max=Math.max(1,...items.map(i=>i.value));
  const bw=(W-P.l-P.r)/items.length;
  const Y=v=>P.t+(1-v/max)*(h-P.t-P.b);
  const bars=items.map((it,i)=>{
    const x=P.l+i*bw+bw*.18,w=bw*.64;
    let y=h-P.b,segs="";
    if(it.stack){it.stack.forEach(s=>{const hh=(s.v/max)*(h-P.t-P.b);y-=hh;segs+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,hh)}" fill="${s.c}"/>`})}
    else segs=`<rect x="${x}" y="${Y(it.value)}" width="${w}" height="${Math.max(0,h-P.b-Y(it.value))}" rx="3" fill="${color}"/>`;
    return segs+`<text x="${x+w/2}" y="${(it.stack?y:Y(it.value))-5}" text-anchor="middle" font-size="11" fill="var(--ink)" font-family="var(--f-mono)">${it.value?fmt(it.value):""}</text>
      <text x="${x+w/2}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(it.label)}</text>`;
  }).join("");
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${h}" style="min-width:${Math.min(W,560)}px" role="img"><line x1="${P.l}" x2="${W-P.r}" y1="${h-P.b}" y2="${h-P.b}" stroke="var(--line)"/>${bars}</svg></div>`;
}
function lineChart(pts,{h=130,min=0,max=10,fmt=v=>v}={}){
  if(!pts.length)return "";
  const W=320,P={l:22,r:12,t:12,b:22};
  const X=i=>P.l+(pts.length===1?.5:i/(pts.length-1))*(W-P.l-P.r),Y=v=>P.t+(1-(v-min)/(max-min))*(h-P.t-P.b);
  const grid=[min,(min+max)/2,max].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${P.l-5}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`).join("");
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=d+` L${X(pts.length-1)} ${h-P.b} L${X(0)} ${h-P.b} Z`;
  const li=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="${i===li?4:2.5}" fill="${i===li?"var(--rope)":"var(--accent)"}"/>`).join("")}
    <text x="${X(0)}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="start">${esc(pts[0].label)}</text>
    <text x="${X(li)}" y="${h-6}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(pts[li].label)}</text></svg>`;
}

/* ---------- PASADAS (parciales) ---------- */
const PCOL=["var(--accent)","var(--rope)","var(--z4)","var(--zrp)"];
function parOf(n){const ks=keysOf(n);return S.par.filter(p=>ks.has(norm(p.nadador))).map(p=>Object.assign({},p,{sp:(p.splits||[]).map(parseT)})).filter(p=>p.sp.length>1&&p.sp.every(x=>x!=null))}
function splitChart(series,tramo){
  const W=Math.round(Math.max(330,Math.min(560,innerWidth-70))),H=210,P={l:44,r:16,t:22,b:30};
  const all=series.flatMap(s=>s.sp),n=Math.max(...series.map(s=>s.sp.length));
  let lo=Math.min(...all),hi=Math.max(...all);const pad=Math.max(.6,(hi-lo)*.25);lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const X=i=>P.l+(n===1?.5:i/(n-1))*(W-P.l-P.r),Y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const step=Math.max(1,Math.round((hi-lo)/4));const ticks=[];for(let v=lo;v<=hi;v+=step)ticks.push(v);
  const grid=ticks.map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}s</text>`).join("");
  const xl=Array.from({length:n},(_,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${(i+1)*tramo}</text>`).join("");
  const main=series[0];const avg=main.sp.reduce((a,b)=>a+b,0)/main.sp.length;
  const lines=series.slice().reverse().map((s,ri)=>{const k=series.length-1-ri,c=PCOL[k%PCOL.length],first=k===0;
    const d=s.sp.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${c}" stroke-width="${first?2.6:1.8}" ${first?"":'stroke-dasharray="5 4" opacity=".85"'} stroke-linejoin="round"/>`+
      s.sp.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${first?4.5:3}" fill="${c}"/>`+(first?`<text x="${X(i)}" y="${Y(v)+(i%2?-10:18)}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${c}" font-family="var(--f-mono)">${fmtT(v)}</text>`:"")).join("")}).join("");
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de pasadas">${grid}
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--muted)" stroke-dasharray="2 4"/><text x="${W-P.r}" y="${Y(avg)-5}" text-anchor="end" font-size="10.5" fill="var(--muted)">prom. ${fmtT(avg)}</text>
    ${lines}${xl}</svg></div>`;
}
/* ---------- PROGRESO MEDIBLE (reemplaza el gráfico de nadadas) ---------- */
function progresoHTML(n,yo){
  const Y=new Date().getFullYear(),hoy=today();
  const mesesDesde=d=>{const a=String(d||"").match(/^(\d{4})-(\d{2})/);if(!a)return null;const b=hoy.match(/^(\d{4})-(\d{2})/);return (+b[1]-+a[1])*12+(+b[2]-+a[2])};
  const bestOf=rs=>rs.reduce((m,r)=>!m||r.seg<m.seg?r:m,null);
  const pct=(d,base)=>`<span class="small">(${d<0?"−":"+"}${Math.abs(d/base*100).toFixed(1)}%)</span>`;
  const t=(r,withDate)=>r?`<span class="time">${fmtT(r.seg)}</span>${withDate?`<div class="date">${fmtD(r.fecha)}</div>`:""}`:`<span class="muted">—</span>`;
  const all=resOf(n.nombre).filter(r=>r.seg!=null);
  const pools=["25","50"].map(pi=>{
    const rs=all.filter(r=>String(r.piscina)===pi);if(!rs.length)return "";
    const byP={};rs.forEach(r=>(byP[r.prueba]=byP[r.prueba]||[]).push(r));
    let alertas=0;
    const filas=Object.keys(byP).sort((a,b)=>ordPrueba(a)-ordPrueba(b)).map(p=>{
      const g=byP[p],pb=bestOf(g),last=g.slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""))[0];
      const bY=bestOf(g.filter(r=>yearOf(r)===String(Y))),bP=bestOf(g.filter(r=>yearOf(r)===String(Y-1)));
      const mej=bY&&bP?bY.seg-bP.seg:null,vs=last.seg-pb.seg,mes=mesesDesde(pb.fecha),est=mes!=null&&mes>=12;
      if(est)alertas++;
      return `<tr><td><b>${esc(p)}</b>${est?`<div><span class="chip pas-old">Sin PB hace ${mes} meses</span></div>`:""}</td>
        <td class="num">${t(pb,true)}</td><td class="num">${t(bY)}</td><td class="num">${t(bP)}</td>
        <td class="num">${mej==null?`<span class="muted">—</span>`:difS(mej)+"<br>"+pct(mej,bP.seg)}</td>
        <td class="num">${t(last,true)}</td><td class="num">${last===pb?`<span class="chip pas-pb">PB</span>`:difS(vs)}</td></tr>`}).join("");
    return `<h3 style="margin-top:6px">Piscina ${pi} m${alertas?` <span class="small down" style="font-family:var(--f-body)">· ${alertas} prueba${alertas>1?"s":""} estancada${alertas>1?"s":""}</span>`:""}</h3>

/* PASADAS v2: diagnóstico parcial a parcial contra el PB */
const sumA=a=>a.reduce((x,y)=>x+y,0);
const tipoOf=p=>p.tipo||(/control|test|entren/i.test(p.torneo||"")?"Control":"Torneo");
function reTramo(sp,from,to){if(+to===+from)return sp.slice();if(to%from)return null;const k=to/from;if(sp.length%k)return null;const o=[];for(let i=0;i<sp.length;i+=k)o.push(sumA(sp.slice(i,i+k)));return o}
const difS=d=>Math.abs(d)<0.005?`<span class="muted">0.00</span>`:`<span class="${d<0?"up":"down"}">${d<0?"−":"+"}${Math.abs(d).toFixed(2)}</span>`;
function pasRef(n,g){ // referencia: parciales del PB, o PB en ritmo parejo
  const last=g[0],pbRes=pbsOf(n.nombre,last.piscina)[last.prueba],pbSeg=pbRes?pbRes.seg:null;
  const best=g.slice().sort((a,b)=>a.tot-b.tot)[0];
  const pbIsPar=pbSeg==null||best.tot<=pbSeg+0.05;
  if(pbIsPar&&best===last){const prev=g[1];return {nuevoPB:true,p:prev||null,lbl:"Anterior",real:!!prev}}
  if(pbIsPar)return {p:best,lbl:"PB",real:true};
  return {even:pbSeg,lbl:"Ritmo PB",real:false,fecha:pbRes.fecha,torneo:pbRes.torneo};
}
function pasBlock(n,g,coach){
  const last=g[0],ref=pasRef(n,g);
  let T=+last.tramo,sA=last.sp,sR=null,refTot=null,real=ref.real;
  if(ref.p){const t2=Math.max(+last.tramo,+ref.p.tramo),a=reTramo(last.sp,last.tramo,t2),r=reTramo(ref.p.sp,ref.p.tramo,t2);
    if(a&&r&&a.length===r.length){T=t2;sA=a;sR=r;refTot=ref.p.tot}else{refTot=ref.p.tot;real=false;sR=sA.map(()=>refTot/sA.length)}}
  else if(ref.even!=null){refTot=ref.even;sR=sA.map(()=>refTot/sA.length)}
  const tot=last.tot,k=sA.length,h=Math.floor(k/2),m1=sumA(sA.slice(0,h)),m2=sumA(sA.slice(k-h));
  let ca=0,cr=0;
  const rows=sA.map((v,i)=>{ca+=v;if(sR)cr+=sR[i];return `<tr><td>${(i+1)*T} m</td>${sR?`<td class="num time">${fmtT(sR[i])}</td>`:""}<td class="num time"><b>${fmtT(v)}</b></td>${sR?`<td class="num">${difS(v-sR[i])}</td><td class="num">${difS(ca-cr)}</td>`:`<td class="num muted">${fmtT(ca)}</td>`}</tr>`}).join("");
  let diag="";
  if(sR&&real&&k>=2){
    const z=k>=3?[["la salida",[0]],["el desarrollo",sA.map((_,i)=>i).slice(1,-1)],["el cierre",[k-1]]]:[["la 1ª mitad",[0]],["la 2ª mitad",[1]]];
    const zd=z.map(([nm,ix])=>[nm,sumA(ix.map(i=>sA[i]-sR[i]))]);const worst=zd.slice().sort((a,b)=>b[1]-a[1])[0],bestZ=zd.slice().sort((a,b)=>a[1]-b[1])[0];
    diag=worst[1]>0.05?`Pierde más tiempo en <b>${worst[0]}</b> (${difS(worst[1])})${bestZ[1]<-0.05?` · gana en <b>${bestZ[0]}</b> (${difS(bestZ[1])})`:""}.`:`Iguala o mejora la referencia en todos los tramos.`;
    diag=`<div class="pas-diag">${diag} <span class="muted small">${zd.map(([nm,d])=>nm.replace(/^(la|el) /,"")+" "+difS(d)).join(" · ")}</span></div>`;
  }else if(sR)diag=`<div class="note">Referencia en ritmo parejo (PB ${fmtT(refTot)} ÷ ${k}): sirve para el total, pero la salida siempre se verá más rápida y el cierre más lento. Carga los parciales de la carrera del PB para ver dónde gana o pierde tiempo.</div>`;
  const refInfo=ref.p?`${esc(ref.lbl==="PB"?"PB":"Medición anterior")}: ${esc(ref.p.torneo||tipoOf(ref.p))} · ${fmtD(ref.p.fecha)}`:ref.even!=null?`PB ${fmtT(ref.even)} sin parciales${ref.torneo?" · "+esc(ref.torneo):""}${ref.fecha?" · "+fmtD(ref.fecha):""}`:"";
  const series=sR?[{sp:sA},{sp:sR}]:[{sp:sA}];
  const hist=g.slice(1,6).map(p=>`<div class="item"><div class="main"><div class="nm">${fmtD(p.fecha)} · ${esc(tipoOf(p))}</div><div class="sub small muted">${esc(p.torneo||"")}</div></div><span class="time">${fmtT(p.tot)}</span>${coach?`<button class="btn ghost sm" data-pdel="${esc(p.id)}">Borrar</button>`:""}</div>`).join("");
  return `<div class="ev"><div class="head"><h3>${esc(last.prueba)} <span class="small muted" style="font-family:var(--f-body)">· piscina ${esc(last.piscina)} m</span></h3><span class="time">${fmtT(tot)}</span></div>
    <div class="row small" style="gap:6px"><span class="chip">${esc(tipoOf(last))}</span>${ref.nuevoPB?`<span class="chip pas-pb">Nuevo PB</span>`:""}<span class="muted">${esc(last.torneo||"")} · ${fmtD(last.fecha)}</span></div>
    <div class="kpi">${refTot!=null?`<div><b>${fmtT(refTot)}</b><span>${esc(ref.lbl)}</span></div><div><b>${difS(tot-refTot)}</b><span>vs ${esc(ref.lbl)}</span></div><div><b>${(refTot/tot*100).toFixed(1)}%</b><span>de ${esc(ref.lbl)}</span></div>`:""}
      <div><b class="${m2<m1?"up":"down"}">${m2<m1?"−":"+"}${Math.abs(m2-m1).toFixed(2)}</b><span>${m2<m1?"Split negativo":"Split positivo"}</span></div></div>
    ${diag}
    <div class="tablewrap"><table class="pas-t"><thead><tr><th>Tramo</th>${sR?`<th class="num">${esc(ref.lbl)}</th>`:""}<th class="num">Última</th>${sR?`<th class="num">Dif.</th><th class="num">Acum.</th>`:`<th class="num">Acum.</th>`}</tr></thead><tbody>${rows}</tbody></table></div>
    ${splitChart(series,T)}
    <div class="legend"><span><i style="background:${PCOL[0]}"></i>Última · ${fmtT(tot)}</span>${sR?`<span><i style="background:${PCOL[1]}"></i>${esc(ref.lbl)} · ${fmtT(refTot)}</span>`:""}</div>
    ${refInfo?`<div class="note">Referencia — ${refInfo}. Verde: más rápido que la referencia; rojo: más lento.</div>`:""}
    ${coach?`<div class="row"><span class="grow"></span><button class="btn ghost sm" data-pdel="${esc(last.id)}">Borrar última</button></div>`:""}
    ${hist?`<details><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">Mediciones anteriores (${g.length-1})</summary><div class="list">${hist}</div></details>`:""}
  </div>`;
}

/* ---------- COMBINADO POR ESTILOS (historial, gráfico y escenarios) ---------- */
const EST4=["Mariposa","Espalda","Pecho","Libre"],ECOL=["var(--zrp)","var(--z2)","var(--z3)","var(--z4)"];
const mesA=d=>{const m=String(d||"").match(/^(\d{4})-(\d{2})/);return m?["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m[2]-1]+"-"+m[1].slice(2):""};
function imGroups(n){
  const G={};
  parOf(n).filter(p=>/Combinado/.test(p.prueba)&&p.sp.length%4===0).forEach(p=>{
    const k=p.sp.length/4,st=[0,1,2,3].map(i=>p.sp.slice(i*k,i*k+k).reduce((a,b)=>a+b,0));
    const r=Object.assign({},p,{st,tot:st.reduce((a,b)=>a+b,0)});const key=p.prueba+"|"+p.piscina;(G[key]=G[key]||[]).push(r)});
  Object.values(G).forEach(g=>g.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")));

}
function imMeta(n,key,pb){
  const m=(n.metas||{})[key];if(!m)return null;
  const sp=(m.sp||[]).map(parseT);
  if(sp.length===4&&sp.every(x=>x!=null))return {st:sp,tot:sp.reduce((a,b)=>a+b,0),rep:false};
  const t=parseT(m.total);if(t==null)return null;
  return pb?{st:pb.st.map(x=>x*t/pb.tot),tot:t,rep:true}:{st:null,tot:t,rep:true};
}
function imChart(g,meta){
  const bars=g.map(r=>({lab:mesA(r.fecha),sub:r.torneo||"",st:r.st,tot:r.tot,meta:false}));
  if(meta&&meta.st)bars.push({lab:"Meta",sub:"",st:meta.st,tot:meta.tot,meta:true});
  const W=Math.round(Math.max(330,Math.min(Math.max(560,bars.length*70+60),innerWidth-70))),H=250,P={l:40,r:8,t:24,b:34},slot=(W-P.l-P.r)/bars.length,narrow=slot<62;
  const hi=Math.ceil(Math.max(...bars.map(b=>b.tot))/30)*30;
  const Y=v=>P.t+(1-v/hi)*(H-P.t-P.b),bw=Math.min(46,(W-P.l-P.r)/bars.length*.62),X=i=>P.l+(i+.5)*(W-P.l-P.r)/bars.length;
  const grid=[];for(let v=0;v<=hi;v+=30)grid.push(`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${fmtT(v,0)}</text>`);
  const body=bars.map((b,i)=>{let acc=0;const x=X(i)-bw/2;
    const segs=b.st.map((v,j)=>{const y0=Y(acc),y1=Y(acc+v);acc+=v;const h=y0-y1;
      return `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${ECOL[j]}" ${b.meta?'fill-opacity=".28" stroke="'+ECOL[j]+'" stroke-dasharray="3 2"':''} stroke-width="1.2"><title>${EST4[j]} ${fmtT(v)}</title></rect>`+
        (h>15&&bw>=26?`<text x="${X(i)}" y="${(y0+y1)/2+4}" text-anchor="middle" font-size="${bw<34?9.5:10.5}" font-family="var(--f-mono)" fill="${b.meta?"var(--ink)":"var(--accent-ink)"}">${v.toFixed(1)}</text>`:"")}).join("");
    return segs+`<text x="${X(i)}" y="${Y(b.tot)-6}" text-anchor="middle" font-size="${narrow?10:11.5}" font-weight="600" font-family="var(--f-mono)" fill="var(--ink)">${fmtT(b.tot,narrow?1:2)}</text>
      <text x="${X(i)}" y="${H-16}" text-anchor="middle" font-size="11" fill="${b.meta?"var(--rope)":"var(--muted)"}" font-weight="${b.meta?700:400}">${esc(b.lab)}</text><title>${esc(b.sub)}</title>`}).join("");
  return `<div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:${W}px" role="img" aria-label="Parciales por estilo en cada competencia">${grid.join("")}${body}</svg></div>
    <div class="legend">${EST4.map((e,j)=>`<span><i style="background:${ECOL[j]}"></i>${e}</span>`).join("")}${meta&&meta.st?`<span><i style="background:transparent;border:1px dashed var(--muted)"></i>Meta${meta.rep?" (repartida según su PB)":""}</span>`:""}</div>`;
}

const fmtTs=t=>{if(!t)return "";const d=new Date(t);return d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})};
const fmtShort=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("es-CL",{day:"2-digit",month:"short"})};
const unread=(th,who)=>!!(th&&th.ultimo&&th.ultimo.de!==who&&th.ultimo.t>(who==="coach"?th.leidoCoach||0:th.leidoNad||0));
function newCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let s="";const r=crypto.getRandomValues(new Uint32Array(6));r.forEach(x=>s+=a[x%a.length]);return s}
function bubbles(msgs,me){
  if(!msgs.length)return `<div class="muted small" style="text-align:center;padding:16px">Aún no hay mensajes.</div>`;
  return msgs.map(m=>{const mine=m.de===me;
    return `<div class="bub ${mine?"mine":""}"><div class="bh"><span class="zb" style="background:${TCOL[m.tipo]||"var(--muted)"}">${esc(TIPOS[m.tipo]||"Mensaje")}</span><span class="date">${fmtTs(m.t)}</span>
      ${mine&&me==="coach"?`<button class="x" data-mdel="${esc(m.id)}" aria-label="Borrar mensaje" title="Borrar">×</button>`:""}</div>
      ${m.texto?`<div class="bt">${esc(m.texto)}</div>`:""}
      ${m.assetId?`<div class="bv"><video src="${SC_BLOB}${esc(m.assetId)}" crossorigin="anonymous" controls playsinline preload="metadata"></video>${m.videoTit?`<div class="small muted">${esc(m.videoTit)}</div>`:""}</div>`:""}</div>`}).join("");
}
function subChat(key){
  if(!S.db||(S.chat&&S.chat.key===key))return;
  if(S.chat&&S.chat.un)try{S.chat.un()}catch(_){}
  S.chat={key,msgs:[],ok:false};
  S.chat.un=S.db.collection("buzon/"+key+"/msgs").orderBy("t").onSnapshot(s=>{if(!S.chat||S.chat.key!==key)return;S.chat.msgs=s.docs.map(d=>Object.assign({},d.data()||{},{id:d.id}));S.chat.ok=true;render()},
    e=>{if(S.chat&&S.chat.key===key){S.chat.ok=true;S.chat.err=e.code;render()}});
}
async function sendMsg(key,m,thread,extra,msgEl){
  m.t=Date.now();
  const ok=await dbWrite(db=>db.collection("buzon/"+key+"/msgs").add(m),msgEl);if(!ok)return false;
  const ultimo={t:m.t,de:m.de,txt:(m.texto||TIPOS[m.tipo]||"").slice(0,90)};
  const leido=m.de==="coach"?{leidoCoach:m.t}:{leidoNad:m.t};
  await dbWrite(db=>thread?db.doc("buzon/"+key).update(Object.assign({ultimo},leido,extra||{})):db.doc("buzon/"+key).set(Object.assign({ultimo,leidoCoach:0,leidoNad:0},leido,extra||{})),msgEl);
  return true;
}
// vincula la solicitud de un nadador (código) con su ficha y mueve los mensajes previos
const linking={};
async function autoLink(){
  if(S.mode!=="coach"||!S.db)return;
  for(const [uid,d] of Object.entries(S.buz)){
    if(!d.codigo||d.nadadorId||linking[uid]||uid.startsWith("n_"))continue;
    const n=S.nad.find(x=>x.codigo&&String(x.codigo).toUpperCase()===String(d.codigo).trim().toUpperCase()&&!x.uid);
    if(!n)continue;await linkUid(n,uid);
  }
}
async function linkUid(n,uid){
    if(linking[uid])return false;linking[uid]=1;
    try{const db=S.db,old="n_"+n.id,od=S.buz[old]||{};
      const snap=await db.collection("buzon/"+old+"/msgs").get();
      for(const m of snap.docs)await db.collection("buzon/"+uid+"/msgs").doc(m.id).set(m.data()||{});
      await db.doc("buzon/"+uid).set({nadadorId:n.id,nombre:n.nombre,ultimo:od.ultimo||null,leidoCoach:od.leidoCoach||0,leidoNad:0,vinculado:Date.now()});
      await db.collection("nadadores").doc(n.id).update({uid,codigo:""});
      for(const m of snap.docs)await db.collection("buzon/"+old+"/msgs").doc(m.id).delete();
      if(S.buz[old])await db.doc("buzon/"+old).delete();
      return true;
    }catch(e){linking[uid]=0;return false}
}

// coach: publica en buzon/<uid>/ficha/datos lo que cada nadador vinculado puede ver de sí mismo
let syncT=null;const fichaHash={};
function scheduleSync(){
  if(S.mode!=="coach"||!S.db||!S.got.nad||!S.got.res||!S.got.par||!S.got.tor)return;
  clearTimeout(syncT);syncT=setTimeout(syncFichas,2500);
}
async function syncFichas(){
  rebuildIdx();
  for(const n of S.nad.filter(x=>x.uid)){
    const ks=keysOf(n);
    const payload={nombre:n.nombre||"",sexo:n.sexo||"",nacimiento:n.nacimiento||"",club:n.club||"",objetivos:n.objetivos||"",pruebasFav:n.pruebasFav||"",metas:n.metas||{},
      res:resOf(n.nombre).filter(r=>r.seg!=null).map(r=>({prueba:r.prueba,piscina:String(r.piscina||""),seg:r.seg,tiempo:r.tiempo||"",fecha:r.fecha||"",torneo:r.torneo||"",lugar:r.lugar||null})),
      par:S.par.filter(p=>ks.has(norm(p.nadador))).map(p=>({prueba:p.prueba,piscina:String(p.piscina||""),tramo:p.tramo,tipo:p.tipo||"",fecha:p.fecha||"",torneo:p.torneo||"",splits:p.splits||[]})),
      vid:S.vid.filter(v=>v.nadadorId===n.id&&v.compartido).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).slice(0,30).map(v=>({id:v.id,assetId:v.assetId,prueba:v.prueba||"",fecha:v.fecha||"",notas:v.notas||"",marcas:v.marcas||[],trazos:v.trazos||[]})),
      inf:(S.inf||[]).filter(i=>i.nadador===n.id).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).slice(0,20).map(i=>({id:i.id,fecha:i.fecha||"",titulo:i.titulo||"",data:i.data}))};
    const h=JSON.stringify(payload);
    if(fichaHash[n.uid]===undefined){try{const s=await S.db.doc("buzon/"+n.uid+"/ficha/datos").get();const d=s.exists?Object.assign({},s.data()):null;if(d)delete d.act;fichaHash[n.uid]=d?JSON.stringify(d):""}catch(_){fichaHash[n.uid]=""}}
    if(fichaHash[n.uid]===h)continue;
    try{await S.db.doc("buzon/"+n.uid+"/ficha/datos").set(Object.assign({},payload,{act:Date.now()}));fichaHash[n.uid]=h}catch(_){}
  }
}

function loadMiFicha(f){
  const n={id:"yo",nombre:f.nombre,sexo:f.sexo,nacimiento:f.nacimiento,club:f.club,objetivos:f.objetivos,pruebasFav:f.pruebasFav,metas:f.metas||{}};
  S.nad=[n];
  S.res=(f.res||[]).map((r,i)=>Object.assign({id:"r"+i,nadador:n.nombre},r));
  S.par=(f.par||[]).map((p,i)=>Object.assign({id:"p"+i,nadador:n.nombre},p));
  S.miInf=f.inf||[];
  S.vid=(f.vid||[]).map(v=>Object.assign({nadadorId:"yo"},v));S.got.vid=1;
  S.got.res=1;
}

function torRow(tid,t,r,i){return {id:"t:"+tid+":"+i,ambito:t.ambito,torneo:t.torneo,fecha:t.fecha,piscina:String(t.piscina||""),nadador:r[0],sexo:r[1],edad:r[2],categoria:r[3]||catDe(r[2]),club:r[4],prueba:r[5],tiempo:r[6],seg:parseT(r[6]),lugar:r[7]||null,tipo:"torneo",tor:tid}}
function rowsFromIdx(d){const out=[];(d.rows||[]).forEach((x,i)=>{const t=(d.meta||{})[x[0]];if(t)out.push(torRow(x[0],t,x.slice(1),x[x.length-1]))});return out}
function loadFullTor(){

    snap.docs.forEach(d=>{const t=d.data()||{};const m={torneo:t.torneo||"",fecha:t.fecha||"",piscina:String(t.piscina||""),ambito:ambitoOf(t)};meta[d.id]=m;(t.rows||[]).forEach((r,i)=>rows.push(torRow(d.id,m,r,i)))});

    ()=>{S.fullTor=false;S.got.tor=1;render()});
}
async function rebuildIdx(){

  const ks=new Set(S.nad.flatMap(n=>[...keysOf(n)]));const meta={},rows=[];
  S.torRows.forEach(r=>{if(!ks.has(norm(r.nadador)))return;meta[r.tor]=S.torMeta[r.tor];rows.push([r.tor,r.nadador,r.sexo,r.edad,r.categoria,r.club,r.prueba,r.tiempo,r.lugar,+r.id.split(":").pop()])});

        ${dists.map(d=>{const r=g.pb[d];return `<td class="num ${r&&r.seg===colBest[d]?"best":""}">${r?`<span class="time">${fmtT(r.seg)}</span><div class="date">${fmtD(r.fecha)}${m.pisc?"":" · "+esc(r.piscina)+"m"}</div>`:'<span class="muted">—</span>'}</td>`}).join("")}</tr>`}).join("")}
    </tbody></table></div><div class="note">Toca una distancia para ordenar. En azul, la mejor marca de cada columna.</div>`

/* ---------- RANKINGS nacional / internacional ---------- */
const ambitoOf=t=>t.ambito||(/sudamericano|mundial|panamericano|world|pan ?am/i.test(t.torneo||"")?"internacional":"nacional");
function periodOk(r,per){
  if(per==="all")return true;
  if(per==="12m"){const d=Date.parse((r.fecha||"")+"T12:00:00");return d&&(Date.now()-d)/864e5<=366}
  return yearOf(r)===per;
}
const swKey=r=>{const n=nadByName(r.nadador);return n?"id:"+n.id:norm(r.nadador)};
const catR=r=>r.categoria||catDe(r.edad);
// índice: ámbito|prueba|sexo|cat|piscina -> Map(swimmer -> {best,row})
function rankIndex(per){
  const ix={};
  S.res.forEach(r=>{
    if(r.tipo!=="torneo"||r.seg==null||!periodOk(r,per))return;
    const k=[r.ambito,r.prueba,r.sexo,catR(r),r.piscina].join("|");
    const m=ix[k]=ix[k]||new Map(),sk=swKey(r),cur=m.get(sk);
    if(!cur||r.seg<cur.best)m.set(sk,{best:r.seg,row:r,n:(cur?cur.n:0)+1});else cur.n++;
  });
  const out={};Object.keys(ix).forEach(k=>{out[k]=[...ix[k].entries()].map(([sk,v])=>Object.assign({sk},v)).sort((a,b)=>a.best-b.best)});
  return out;
}

    ${list.length?`<div class="tablewrap"><table><thead><tr><th class="num">#</th><th>Nadador</th><th>Club</th>${allc?"<th>Cat.</th>":""}<th class="num">Mejor</th><th>Torneo</th></tr></thead><tbody>

function mkRow(ctx,o){
  const edad=parseInt(o.edad,10),seg=parseT(o.tiempo);
  let prueba=String(o.prueba||"").trim().replace(/\s+/g," ").replace(/^(\d+)\s*m?\s*/i,"$1 ");
  const pm=PRUEBAS.find(p=>norm(p)===norm(prueba));if(pm)prueba=pm;
  const sexo=/^(f|d|dam|muj)/i.test(o.sexo)?"F":/^(m|v|var|hom)/i.test(o.sexo)?"M":String(o.sexo||"").toUpperCase();
  return {torneo:ctx.torneo,fecha:ctx.fecha,piscina:ctx.piscina,nadador:String(o.nadador||"").trim(),sexo,edad:isNaN(edad)?null:edad,categoria:catDe(edad),club:String(o.club||"").trim(),prueba,tiempo:String(o.tiempo||"").trim(),seg,lugar:parseInt(o.lugar,10)||null};
}
function bindCargar(){
  $("#c-go").onclick=async()=>{
    const m=$("#c-msg"),ctx={torneo:$("#c-torneo").value.trim(),fecha:$("#c-fecha").value,piscina:$("#c-pisc").value};
    if(!ctx.torneo||!ctx.fecha){m.innerHTML=`<span class="down">Completa el nombre y la fecha del torneo.</span>`;return}
    const lines=$("#c-bulk").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),rows=[],bad=[];
    lines.forEach((l,i)=>{const c=l.split(/\t|;/).map(x=>x.trim());if(c.length<6){bad.push(i+1);return}
      const r=mkRow(ctx,{nadador:c[0],sexo:c[1],edad:c[2],club:c[3],prueba:c[4],tiempo:c[5],lugar:c[6]});
      if(!r.nadador||(r.seg==null&&!/^(nt|ns|dq|dsq|dnf)$/i.test(r.tiempo)))bad.push(i+1);else rows.push(r)});
    if(!rows.length){m.innerHTML=`<span class="down">No encontré filas válidas${bad.length?" (revisa líneas "+bad.slice(0,8).join(", ")+")":""}.</span>`;return}
    $("#c-go").disabled=true;let ok=0;
    for(const r of rows){if(!await dbWrite(db=>db.collection("resultados").add(r),m))break;ok++;m.textContent="Cargando "+ok+" de "+rows.length+"…"}
    if(ok===rows.length){m.innerHTML=`<span class="up">${ok} resultados cargados${bad.length?". Omitidas líneas "+bad.slice(0,8).join(", "):""}.</span>`;$("#c-bulk").value=""}
    $("#c-go").disabled=false;
  };
}

function targetsFor(s,e){
  return e.nads.map(id=>nadById(id)).filter(Boolean).map(n=>{
    if(!ESTILOS.includes(s.estilo))return {n,none:"—"};
    const ref=refPB(n.nombre,s.estilo,+s.dist,e.piscina),mt=parseT(s.meta);
    if(!ref&&mt==null)return {n,none:"Sin PB en "+s.estilo};
    const rg=mt!=null?[mt,mt]:zoneRange(ref.t,s.zona);if(!rg)return {n,none:"Zona sin definir"};
    const sal=parseT(s.salida);
    return {n,ref,rg,rest:sal!=null?sal-rg[1]:null};
  });
}
function enMetaCell(st){
  if(!st)return `<span class="muted small">—</span>`;
  if(!st.rg)return `<span class="small">${fmtT(st.avg,1)} prom.</span>`;
  const ok=st.inR===st.ts.length,cls=ok?"up":st.inR/st.ts.length>=0.5?"":"down";
  const fast=st.ts.filter(t=>t<st.rg[0]-(st.rg[0]===st.rg[1]?st.rg[0]*0.02:0.05)).length,slow=st.ts.length-st.inR-fast;
  return `<b class="${cls}">${st.inR}/${st.ts.length}</b><div class="small muted">prom. ${fmtT(st.avg,1)}${slow?` · ${slow} lenta${slow>1?"s":""}`:""}${fast?` · ${fast} rápida${fast>1?"s":""}`:""}</div>`;
}
function edStat(s,e,nid){const x=targetsFor(s,e).find(y=>y.n.id===nid);const txt=(s.reales||{})[nid]||"";return statsOf(txt,x&&x.ref?x.ref.t:null,s.zona,parseT(s.meta))}
function edResumen(){

  box.innerHTML=`<div class="kpi"><div><b class="${ok/tot>=0.8?"up":ok/tot<0.5?"down":""}">${Math.round(ok/tot*100)}%</b><span>Reps en meta</span></div><div><b>${ok}/${tot}</b><span>Reps registradas</span></div>

}

function sessionText(e){

function statsOf(txt,ref,zona,meta){
  const ts=String(txt||"").split(/[\/\s,;]+/).map(parseT).filter(x=>x!=null);
  if(!ts.length)return null;
  const avg=ts.reduce((a,b)=>a+b,0)/ts.length,sd=Math.sqrt(ts.reduce((a,b)=>a+(b-avg)*(b-avg),0)/ts.length);
  const rg=meta!=null?[meta,meta]:ref?zoneRange(ref,zona):null,tol=rg&&rg[0]===rg[1]?rg[0]*0.02:0.05;
  return {ts,avg,sd,best:Math.min(...ts),worst:Math.max(...ts),drop:ts[ts.length-1]-ts[0],pctAvg:ref?ref/avg*100:null,pctBest:ref?ref/Math.min(...ts)*100:null,rg,inR:rg?ts.filter(t=>t>=rg[0]-tol&&t<=rg[1]+tol).length:null};
}
function statCell(st,ref){
  if(!st)return `<span class="muted small">Escribe los tiempos separados por /</span>`;

    <div><b>±${st.sd.toFixed(1)}</b><span>Regularidad</span></div>
    ${r?`<div><b>${st.inR}/${st.ts.length}</b><span>En meta ${r[0]===r[1]?fmtT(r[0],1):fmtT(r[0],1)+"–"+fmtT(r[1],1)}</span></div>`:""}</div>`;
}

      <div class="row"><button class="btn" id="if-pub">Guardar y publicar al nadador</button><span id="if-msg" class="small"></span></div>`:""}
    <details ${iaOn?"":"open"}><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">Sin IA: copiar y pegar en un chat de Claude</summary>
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="if-cp">1 · Copiar para Claude</button><button class="btn ghost sm" id="if-pg">2 · Pegar informe</button></div>

        <div class="row"><button class="btn sm" id="if-load">Ver informe</button><span id="if-msg2" class="small"></span></div></div></details></section>`;
}
function bindInfFicha(n){
  const d=S.infDraft[n.id];if(!d||!$("#if-f"))return;
  const rerender=()=>{if(location.hash==="#ficha-"+encodeURIComponent(n.id))render(true)};
  $("#if-f").onchange=e=>{d.fecha=e.target.value||today();render(true)};
  $("#if-p").onchange=e=>{d.pisc=e.target.value};
  if($("#if-t"))$("#if-t").addEventListener("input",e=>{d.txt=e.target.value});
  const hasData=()=>d.txt.trim()||infSesDia(n,d.fecha,d.pisc).series.length;
  async function ask(){
    d.busy=true;d.err="";rerender();
    try{const t=await S.ia.chat(d.chat.map(m=>({role:m.role,content:m.content})));d.chat.push({role:"assistant",content:t});const r=infTryParse(t);if(r)d.rep=r}
    catch(e){d.err=e.code==="no_ia"?"La función de IA no está instalada en Supabase todavía.":e.code==="sin_clave"?"Falta guardar la clave de Claude en Supabase (ANTHROPIC_API_KEY).":e.code==="solo_coach"?"Solo el entrenador puede generar informes.":"No se pudo generar: "+(e.message||e.code||e);
      if(d.chat.length&&d.chat[d.chat.length-1].role==="user"&&d.chat.length===1)d.chat=[]}
    d.busy=false;rerender();
  }
  if($("#if-go"))$("#if-go").onclick=()=>{if(!hasData()){d.err="Escribe primero el entreno.";render(true);return}
    d.sent=d.txt.trim();d.rep=null;d.chat=[{role:"user",content:infPrompt(infSesDia(n,d.fecha,d.pisc),n,d.txt)}];ask()};
  if($("#if-send"))$("#if-send").onclick=()=>{const t=$("#if-say").value.trim();if(!t)return;d.chat.push({role:"user",content:t});ask()};
  if($("#if-new"))$("#if-new").onclick=()=>{d.chat=[];d.rep=null;d.err="";render(true)};
  $("#if-cp").onclick=ev=>{if(!hasData()){ev.target.textContent="Escribe primero el entreno";setTimeout(()=>ev.target.textContent="1 · Copiar para Claude",1600);return}
    copyText(infPrompt(infSesDia(n,d.fecha,d.pisc),n,d.txt),ev.target)};
  $("#if-pg").onclick=()=>{d.open=true;$("#if-box").hidden=false;$("#if-r").focus()};
  $("#if-load").onclick=()=>{try{d.rep=infParse($("#if-r").value);d.sent=d.txt;render(true)}catch(e){$("#if-msg2").innerHTML=`<span class="down">${esc(e.message)}</span>`}};
  if($("#if-pub"))$("#if-pub").onclick=async()=>{const m=$("#if-msg"),s=infSesDia(n,d.fecha,d.pisc),id=infId(s.id,n.id);
    const doc={sesion:s.id,nadador:n.id,nombre:n.nombre,fecha:d.fecha,titulo:s.titulo||"",texto:d.sent||d.txt,data:d.rep,act:Date.now()};
    if(await dbWrite(db=>db.collection("informes").doc(id).set(doc),m)){S.infDraft[n.id]=null;location.hash="#inf-"+encodeURIComponent(id)}};
}

  const groups={};rs.forEach(r=>{const k=(r.fecha||"")+"|"+r.torneo;(groups[k]=groups[k]||[]).push(r)});

    let gpb=0;

      <div class="row" style="gap:6px">${gpb?`<span class="chip pas-pb">${gpb} PB</span>`:""}${gm.map((c,i)=>c?`<span class="medal m${i+1}" title="${["Oro","Plata","Bronce"][i]}">${c}</span>`:"").join("")}</div></div>

R.calculadora={html(){
  const c=S.calc,dp=S.dps,sp=S.split;
  return `<section class="card"><div class="head"><h2>Race pace y zonas</h2></div>
    <div class="form three">
      <label class="full">Nadador (opcional)<select id="c-nad"><option value="">Ingresar PB a mano</option>${S.nad.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(n=>`<option value="${esc(n.id)}" ${c.nad===n.id?"selected":""}>${esc(n.nombre)}</option>`).join("")}</select></label>

    <div class="form three">

      <label>Cuento<select id="d-cuenta"><option value="ciclos" ${dp.cuenta==="ciclos"?"selected":""}>Ciclos (2 brazos)</option><option value="brazadas" ${dp.cuenta==="brazadas"?"selected":""}>Brazadas (cada brazo)</option></select></label>

      <label class="full">Largos: tiempo ; ciclos (uno por línea)<textarea id="d-txt" style="font-family:var(--f-mono)">${esc(dp.txt)}</textarea></label>
    </div><div id="d-out"></div></section>

    <div class="form three"><label>Distancia<input id="s-dist" type="number" step="25" min="50" value="${sp.dist}"></label><label>Tiempo meta<input id="s-t" value="${esc(sp.t)}" inputmode="decimal"></label>
      <label>Cada<select id="s-tr">${[25,50,100].map(v=>`<option ${+sp.tramo===v?"selected":""}>${v}</option>`).join("")}</select></label></div><div id="s-out"></div></section>
  <section class="card"><div class="head"><h2>Conversor de pace</h2></div>
    <h3>Tiempo → pace</h3>
    <div class="form three"><label>Distancia (m)<input id="p-d1" type="number" min="25" step="25" value="${S.pace.d1}"></label><label>Tiempo<input id="p-t1" value="${esc(S.pace.t1)}" inputmode="decimal" placeholder="2:30.00"></label></div><div id="p-o1"></div>
    <h3 style="margin-top:14px">Pace → tiempo total</h3>
    <div class="form three"><label>Distancia (m)<input id="p-d2" type="number" min="25" step="25" value="${S.pace.d2}"></label><label>Pace /100<input id="p-p2" value="${esc(S.pace.p2)}" inputmode="decimal" placeholder="1:30.00"></label></div><div id="p-o2"></div>
    <h3 style="margin-top:14px">% de cumplimiento</h3>
    <div class="form three"><label>Tiempo objetivo<input id="p-obj" value="${esc(S.pace.obj)}" inputmode="decimal"></label><label>Tiempo real (uno o varios: 1:31/1:30/1:32)<input id="p-real" value="${esc(S.pace.real)}" inputmode="decimal"></label></div><div id="p-o3"></div>
    <details style="margin-top:14px"><summary class="small"><b>Tabla rápida de paces</b> (0:45 a 2:30 por 100)</summary>${paceTableHTML()}</details></section>
  <section class="card"><div class="head"><h2>Intensidades % del plantel</h2></div>

  $("#i-est").onchange=e=>{S.int.estilo=e.target.value;calcInt()};$("#i-pis").onchange=e=>{S.int.pisc=e.target.value;calcInt()};$("#i-nad").onchange=e=>{S.int.nad=e.target.value;calcInt()};
  calcRP();calcDPS();calcSplit();calcPace();calcInt();
}};
const INT_PCTS=[60,65,70,75,80,85,90,95,100];
function zoneOfPct(p){const zs=zonas();if(p<zs[0].min)return "Reg";const Z=zs.find(x=>p>=x.min&&p<x.max);return Z?Z.z:zs[zs.length-1].z}
function paceTableHTML(){
  const ds=[50,100,200,400,800,1000,1500],ps=[];for(let p=45;p<=150;p+=5)ps.push(p);
  return `<div class="tablewrap"><table><thead><tr><th class="num">Pace /100</th>${ds.map(d=>`<th class="num">${d} m</th>`).join("")}</tr></thead><tbody>${ps.map(p=>`<tr><td class="num time"><b>${fmtT(p)}</b></td>${ds.map(d=>`<td class="num time">${fmtT(p*d/100)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function hms(t){const h=Math.floor(t/3600);return h?h+":"+String(Math.floor(t%3600/60)).padStart(2,"0")+":"+(t%60<10?"0":"")+(t%60).toFixed(2):fmtT(t)}
function calcPace(){
  const c=S.pace,d1=+c.d1,t1=parseT(c.t1),d2=+c.d2,p2=parseT(c.p2),ob=parseT(c.obj);
  $("#p-o1").innerHTML=t1==null||!d1?`<div class="muted small">Ingresa distancia y tiempo.</div>`:
    `<div class="kpi"><div><b>${t1.toFixed(2)} s</b><span>Tiempo en segundos</span></div><div><b>${fmtT(t1/d1*100)}</b><span>Pace /100</span></div><div><b>${fmtT(t1/d1*50)}</b><span>Pace /50</span></div><div><b>${fmtT(t1/d1*25)}</b><span>Pace /25</span></div><div><b>${(d1/t1).toFixed(3)}</b><span>m/s</span></div></div>`;
  $("#p-o2").innerHTML=p2==null||!d2?`<div class="muted small">Ingresa distancia y pace por 100.</div>`:
    (()=>{const T=p2*d2/100;return `<div class="kpi"><div><b>${fmtT(T)}</b><span>Tiempo total</span></div><div><b>${hms(T)}</b><span>h:mm:ss</span></div><div><b>${T.toFixed(2)} s</b><span>Segundos</span></div><div><b>${(d2/T).toFixed(3)}</b><span>m/s</span></div></div>`})();
  const rs=String(c.real||"").split(/[\/;\s]+/).map(parseT).filter(x=>x!=null);
  if(ob==null||!rs.length){$("#p-o3").innerHTML=`<div class="muted small">Ingresa el objetivo y al menos un tiempo real.</div>`;return}
  const avg=rs.reduce((a,b)=>a+b,0)/rs.length,best=Math.min(...rs),worst=Math.max(...rs),pct=ob/avg*100;
  $("#p-o3").innerHTML=`<div class="kpi"><div style="background:color-mix(in srgb,var(--${pct>=100?"z2":"z5"}) 16%,transparent)"><b>${pct.toFixed(1)}%</b><span>Cumplido (objetivo ÷ real prom.)</span></div><div><b>${fmtT(avg)}</b><span>Real promedio</span></div>${rs.length>1?`<div><b>${fmtT(best)}</b><span>Mejor</span></div><div><b>${fmtT(worst)}</b><span>Peor</span></div>`:""}<div><b class="${avg<=ob?"up":"down"}">${avg<=ob?"−":"+"}${Math.abs(avg-ob).toFixed(2)} s</b><span>vs objetivo</span></div></div>
    <div class="note">Sobre 100% = más rápido que el objetivo.</div>`;
}
function calcInt(){
  const I=S.int,o=$("#i-out"),ds=I.estilo==="Libre"?[50,100,200,400]:I.estilo==="Combinado"?[100,200,400]:[50,100,200];
  const nads=(I.nad?[nadById(I.nad)].filter(Boolean):S.nad.slice()).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const head=`<thead><tr><th>Nadador</th><th class="num">PB</th>${INT_PCTS.map(p=>`<th class="num">${p}%<div>${p<zonas()[0].min?`<span class="small muted">Reg.</span>`:zb(zoneOfPct(p))}</div></th>`).join("")}</tr></thead>`;
  const row=(nm,t,extra)=>`<tr><td>${nm}</td><td class="num time"><b>${extra||fmtT(t)}</b></td>${INT_PCTS.map(p=>`<td class="num time">${t==null?"":fmtT(t/(p/100))}</td>`).join("")}</tr>`;
  o.innerHTML=ds.map(d=>{
    const pr=d+" "+I.estilo,key=pr+"|"+I.pisc;
    const rows=nads.map(n=>{const r=pbsOf(n.nombre,I.pisc)[pr];return r?{n,r}:null}).filter(Boolean).sort((a,b)=>a.r.seg-b.r.seg);
    const mt=parseT(I.man[key]);

// convierte a MP4/WebM (H.264 o VP8/9), recorta a "max" s y baja a 1280 px: dibuja el video en un canvas y lo graba
async function recodeVideo(file,start,max,onProg){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw {code:"no_recode"};
  const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));if(!mime)throw {code:"no_recode"};
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.src=URL.createObjectURL(file);
  v.style.cssText="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";document.body.appendChild(v);
  try{
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=()=>rej({code:"no_recode"})});
    const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),cw=Math.round(v.videoWidth*sc/2)*2,ch=Math.round(v.videoHeight*sc/2)*2;
    const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
    const end=Math.min(v.duration,start+max);

    await new Promise(res=>{const tick=()=>{x.drawImage(v,0,0,cw,ch);onProg&&onProg(v.currentTime-start);if(v.currentTime>=end-0.03||v.ended){res();return}

    v.pause();rec.stop();await done;
    const type=mime.split(";")[0],blob=new Blob(parts,{type});
    return new File([blob],"clip."+(type==="video/mp4"?"mp4":"webm"),{type});
  }finally{v.remove();URL.revokeObjectURL(v.src)}
}

  try{S.ia=await window.claude.use("ia")}catch(_){}
  try{S.sample=await window.claude.use("sample")}catch(_){}
  const sub=(col,key,map)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>map(Object.assign({},d.data()||{},{id:d.id})));S.got[key]=1;render()},
    e=>{S.got[key]=1;$("#view").insertAdjacentHTML("afterbegin",`<div class="msg err">No se pudieron leer los datos (${esc(e.code)}). Recarga la página.</div>`)});
  db.collection("nadadores").onSnapshot(snap=>{S.nad=snap.docs.map(d=>Object.assign({},d.data()||{},{id:d.id}));S.got.nad=1;render();autoLink()},
    e=>{S.got.nad=1;$("#view").insertAdjacentHTML("afterbegin",`<div class="msg err">No se pudieron leer los datos (${esc(e.code)}). Recarga la página.</div>`)});
  db.collection("resultados").onSnapshot(snap=>{S.resDocs=snap.docs.map(d=>{const x=Object.assign({},d.data()||{},{id:d.id});x.seg=typeof x.seg==="number"?x.seg:parseT(x.tiempo);return x});mergeRes();S.got.res=1;render()},
    e=>{S.got.res=1;$("#view").insertAdjacentHTML("afterbegin",`<div class="msg err">No se pudieron leer los resultados (${esc(e.code)}). Recarga la página.</div>`)});
  // al abrir solo se carga el índice liviano con los nadadores del plantel; los torneos completos, al entrar a Resultados
  db.doc("config/idxTorneos").onSnapshot(s=>{const d=s.exists?s.data()||{}:null;
    if(!d){loadFullTor();return}
    S.idxJSON=JSON.stringify({meta:d.meta||{},rows:d.rows||[]});
    if(S.fullTor!==true){S.torRows=rowsFromIdx(d);mergeRes();S.got.tor=1;render()}},()=>loadFullTor());
  if(S.view==="resultados"||(S.view==="tiempos"&&S.mt.scope!=="plantel"))loadFullTor();
  sub("sesiones","ses",x=>x);
  sub("videos","vid",x=>x);
  sub("parciales","par",x=>x);
  sub("informes","inf",x=>x);
  db.doc("config/app").onSnapshot(s=>{const d=s.exists?s.data()||{}:{};S.cfg={miClub:d.miClub||"",zonas:Array.isArray(d.zonas)&&d.zonas.length?d.zonas:Z_DEF};render()},()=>{});
  render(true);
})();
})();
</script>
</body></html>
